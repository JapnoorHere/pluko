services:
  api:
    build:
      context: ..
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    command: node start.mjs
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4180
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      DATA_DIR: /var/lib/pluko
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TRUST_PROXY: "true"
    # Reachable only from this machine, for a reverse proxy already running on the host (see Caddyfile.host-proxy).
    ports:
      - "127.0.0.1:${API_PORT:-4180}:4180"
    volumes:
      - pluko-data:/var/lib/pluko
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4180/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  worker:
    build:
      context: ..
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    command: node worker.mjs
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      DATA_DIR: /var/lib/pluko
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TRUST_PROXY: "true"
      PLUKO_PROVIDER: ${PLUKO_PROVIDER:-bing}
    volumes:
      - pluko-data:/var/lib/pluko
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # Optional bundled HTTPS proxy. Only starts with `--profile caddy`, for servers with nothing else on ports 80/443.
  caddy:
    profiles: ["caddy"]
    image: caddy:2.10-alpine
    environment:
      PLUKO_DOMAIN: ${PLUKO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pluko-data:
  caddy-data:
  caddy-config:
